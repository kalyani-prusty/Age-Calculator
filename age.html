<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Age Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border-radius: 15px;
      padding: 40px 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 25px;
      color: #00e5ff;
    }

    label {
      font-size: 1rem;
      display: block;
      margin-bottom: 10px;
    }

    input[type="date"] {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      width: 100%;
      max-width: 250px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      background: #00e5ff;
      color: #121212;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    button:hover {
      background: #00bcd4;
      transform: scale(1.05);
      box-shadow: 0 0 15px #00e5ff;
    }

    #result {
      font-size: 1.2rem;
      font-weight: 500;
      color: #ffffff;
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px 20px;
      }

      h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Age Calculator</h2>
    <label for="dob">Select Your Date of Birth:</label>
    <input type="date" id="dob" />
    <br>
    <button onclick="calculateAge()">Calculate Age</button>
    <p id="result"></p>
  </div>

  <script>
    function calculateAge() {
      const dobInput = document.getElementById("dob").value;
      const resultEl = document.getElementById("result");

      if (!dobInput) {
        resultEl.innerHTML = "Please select your date of birth.";
        return;
      }

      const dob = new Date(dobInput);
      const today = new Date();
      let age = today.getFullYear() - dob.getFullYear();

      if (
        today.getMonth() < dob.getMonth() ||
        (today.getMonth() === dob.getMonth() && today.getDate() < dob.getDate())
      ) {
        age--;
      }

      resultEl.innerHTML = `🎉 Your age is <strong>${age}</strong> years.`;
    }
  </script>

</body>
</html>
